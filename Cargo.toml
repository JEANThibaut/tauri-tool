[workspace]
resolver = "2"
members = [
    "apps/tool-1/src-tauri",
    "apps/tool-2/src-tauri",
    "common",
]

[workspace.dependencies]
# Dépendances communes pour toutes les apps
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
# Optimisations pour la compilation release
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
